# Nginx reverse proxy for cart.mindshare.dev -> Node app on 127.0.0.1:3000
#
# Install on the droplet as:
#   /etc/nginx/sites-available/cart.mindshare.dev
# then symlink into sites-enabled (see README).
#
# This is the plain HTTP (port 80) config. Running:
#   certbot --nginx -d cart.mindshare.dev
# will automatically add the HTTPS (443) server block, the certificate paths,
# and an HTTP->HTTPS redirect. You normally won't edit this again afterward.

server {
    listen 80;
    listen [::]:80;
    server_name cart.mindshare.dev;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
